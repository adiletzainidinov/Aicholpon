<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Айчолпон · Админка</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#f4f7fc;color:#273d6b;margin:0}.wrap{max-width:920px;margin:auto;padding:22px}h1{font-size:30px}input,button{padding:13px;border:1px solid #bac8e2;border-radius:12px;font:inherit}input{width:100%;margin:8px 0}button{background:#415d9b;color:white;cursor:pointer;margin:4px}button.alt{background:#e8edfa;color:#3b5492}.card{background:white;padding:18px;border-radius:18px;margin:12px 0;overflow-wrap:anywhere;box-shadow:0 4px 18px #314b7310}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.muted{color:#6e7f9e}.error{color:#b32939}.ok{color:#276c49}a{color:#3855a0}.hide{display:none}small{font-size:12px}</style><main class="wrap"><h1>Айчолпон · Админка</h1><p><a href="/">← Приглашение</a></p><div id="login" class="card"><h2>Защищённый вход</h2><p class="muted">Войдите с помощью учётной записи администратора Koran Academy.</p><form id="auth"><input id="email" type="email" placeholder="Электронная почта" autocomplete="email" required><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button>Войти</button></form><p id="auth-msg" class="error"></p></div><div id="dashboard" class="hide"><button class="alt" id="logout">Выйти</button><div class="grid"><div class="card">Приглашений<h1 id="total">0</h1></div><div class="card">Придут<h1 id="yes">0</h1></div><div class="card">Количество гостей<h1 id="people">0</h1></div><div class="card">Не придут<h1 id="no">0</h1></div><div class="card">Нет ответа<h1 id="pending">0</h1></div></div><h2>Создать приглашение</h2><form id="add"><input id="name" placeholder="Имя гостя или семьи" maxlength="120" required><button>Создать персональную ссылку</button></form><p id="msg"></p><h2>Список гостей</h2><button id="export" class="alt">Скачать CSV</button><button id="refresh" class="alt">Обновить ответы</button><div id="list"></div></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.1';
const db=createClient('https://qmuzgzolumobfpburvdb.supabase.co','sb_publishable_-Ot4rmGU_7O749DLLmhOIw_1TmnlXs7',{auth:{persistSession:true}});
let guests=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=g=>location.origin+'/?token='+encodeURIComponent(g.invite_token);
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){$('#login').classList.remove('hide');$('#dashboard').classList.add('hide');return}const {data,error}=await db.from('aicholpon_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){$('#auth-msg').textContent='У этой учётной записи нет прав администратора.';$('#login').classList.remove('hide');$('#dashboard').classList.add('hide');return}$('#login').classList.add('hide');$('#dashboard').classList.remove('hide');await load()}
$('#auth').onsubmit=async e=>{e.preventDefault();$('#auth-msg').textContent='Проверяем вход…';const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#auth-msg').textContent=error.message;return}$('#auth-msg').textContent='';await check()};
$('#logout').onclick=async()=>{await db.auth.signOut();check()};
async function load(){const {data,error}=await db.from('aicholpon_guests').select('id,name,invite_token,attending,people,responded_at,created_at').order('created_at',{ascending:false});if(error){$('#msg').textContent=error.message;return}guests=data||[];render()}
function render(){$('#total').textContent=guests.length;$('#yes').textContent=guests.filter(g=>g.attending===true).length;$('#no').textContent=guests.filter(g=>g.attending===false).length;$('#people').textContent=guests.reduce((n,g)=>n+(g.attending?g.people||0:0),0);$('#pending').textContent=guests.filter(g=>g.attending===null).length;$('#list').innerHTML=guests.map(g=>'<div class="card"><b>'+esc(g.name)+'</b> · '+(g.attending===true?'Придёт ('+g.people+')':g.attending===false?'Не придёт':'Ожидаем ответ')+'<p><a target="_blank" rel="noopener" href="'+esc(link(g))+'">'+esc(link(g))+'</a></p><button data-act="copy" data-id="'+g.id+'" class="alt">Копировать</button><button data-act="whatsapp" data-id="'+g.id+'" class="alt">WhatsApp</button><button data-act="rename" data-id="'+g.id+'" class="alt">Изменить</button><button data-act="delete" data-id="'+g.id+'" class="alt">Удалить</button></div>').join('')}
$('#add').onsubmit=async e=>{e.preventDefault();const name=$('#name').value.trim();if(!name)return;const {error}=await db.from('aicholpon_guests').insert({name});$('#msg').textContent=error?error.message:'Приглашение создано';if(!error){e.target.reset();await load()}};
$('#list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const g=guests.find(x=>x.id===b.dataset.id);if(!g)return;switch(b.dataset.act){case 'copy':await navigator.clipboard.writeText(link(g));alert('Ссылка скопирована');return;case 'whatsapp':window.open('https://wa.me/?text='+encodeURIComponent(g.name+', сизди Айчолпондун кыз узатуу тоюна чакырабыз! '+link(g)),'_blank');return;case 'rename':{const n=prompt('Имя гостя',g.name);if(!n?.trim())return;const {error}=await db.from('aicholpon_guests').update({name:n.trim()}).eq('id',g.id);if(error)alert(error.message);break}case 'delete':if(!confirm('Удалить приглашение?'))return;{const {error}=await db.from('aicholpon_guests').delete().eq('id',g.id);if(error)alert(error.message);break}}await load()};
$('#refresh').onclick=load;$('#export').onclick=()=>{const rows=[['Имя','Ссылка','Ответ','Людей'],...guests.map(g=>[g.name,link(g),g.attending===null?'':g.attending?'Придёт':'Не придёт',g.people??''])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='aicholpon-guests.csv';a.click();URL.revokeObjectURL(a.href)};await check();
</script></html>
