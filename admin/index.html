<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Айчолпон · Админка</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#f4f7fc;color:#273d6b;margin:0}.wrap{max-width:920px;margin:auto;padding:22px}h1{font-size:30px}input,button{padding:13px;border:1px solid #bac8e2;border-radius:12px;font:inherit}input{width:100%;margin:8px 0}button{background:#415d9b;color:white;cursor:pointer;margin:4px}button.alt{background:#e8edfa;color:#3b5492}.card{background:white;padding:18px;border-radius:18px;margin:12px 0;overflow-wrap:anywhere;box-shadow:0 4px 18px #314b7310}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.muted{color:#6e7f9e}.error{color:#b32939}.ok{color:#276c49}a{color:#3855a0}.hide{display:none}small{font-size:12px}</style><main class="wrap"><h1>Айчолпон · Админка</h1><p><a href="/">← Приглашение</a></p><div id="login" class="card"><h2>Защищённый вход</h2><p class="muted">Введите пароль администратора.</p><form id="auth"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button>Войти</button></form><p id="auth-msg" class="error"></p></div><div id="dashboard" class="hide"><button class="alt" id="logout">Выйти</button><div class="grid"><div class="card">Приглашений<h1 id="total">0</h1></div><div class="card">Придут<h1 id="yes">0</h1></div><div class="card">Количество гостей<h1 id="people">0</h1></div><div class="card">Не придут<h1 id="no">0</h1></div><div class="card">Нет ответа<h1 id="pending">0</h1></div></div><h2>Создать приглашение</h2><form id="add"><input id="name" placeholder="Имя гостя или семьи" maxlength="120" required><button>Создать персональную ссылку</button></form><p id="msg"></p><h2>Список гостей</h2><button id="export" class="alt">Скачать CSV</button><button id="refresh" class="alt">Обновить ответы</button><div id="list"></div></div></main><script>
const endpoint='https://qmuzgzolumobfpburvdb.supabase.co/functions/v1/aicholpon-client-admin';
let guests=[],password=sessionStorage.getItem('aicholpon_client_password')||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]||'&#39;'));
const link=g=>location.origin+'/?token='+encodeURIComponent(g.invite_token);
async function api(action,params={}){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password,...params})});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'Ошибка сервера');return j.data}
function showLogin(){ $('#login').classList.remove('hide');$('#dashboard').classList.add('hide') }
async function load(){guests=await api('list')||[];render()}
async function check(){if(!password){showLogin();return}try{await load();$('#login').classList.add('hide');$('#dashboard').classList.remove('hide');$('#auth-msg').textContent=''}catch(e){password='';sessionStorage.removeItem('aicholpon_client_password');showLogin();$('#auth-msg').textContent=e.message}}
$('#auth').onsubmit=async e=>{e.preventDefault();password=$('#password').value;$('#auth-msg').textContent='Проверяем вход…';await check()};
$('#logout').onclick=()=>{password='';sessionStorage.removeItem('aicholpon_client_password');$('#password').value='';showLogin()};
function render(){sessionStorage.setItem('aicholpon_client_password',password);$('#total').textContent=guests.length;$('#yes').textContent=guests.filter(g=>g.attending===true).length;$('#no').textContent=guests.filter(g=>g.attending===false).length;$('#people').textContent=guests.reduce((n,g)=>n+(g.attending?g.people||0:0),0);$('#pending').textContent=guests.filter(g=>g.attending===null).length;$('#list').innerHTML=guests.map(g=>'<div class="card"><b>'+esc(g.name)+'</b> · '+(g.attending===true?'Придёт ('+g.people+')':g.attending===false?'Не придёт':'Ожидаем ответ')+'<p><a target="_blank" rel="noopener" href="'+esc(link(g))+'">'+esc(link(g))+'</a></p><button data-act="copy" data-id="'+g.id+'" class="alt">Копировать</button><button data-act="whatsapp" data-id="'+g.id+'" class="alt">WhatsApp</button><button data-act="rename" data-id="'+g.id+'" class="alt">Изменить</button><button data-act="delete" data-id="'+g.id+'" class="alt">Удалить</button></div>').join('')}
$('#add').onsubmit=async e=>{e.preventDefault();try{await api('add',{name:$('#name').value.trim()});$('#msg').textContent='Приглашение создано';e.target.reset();await load()}catch(err){$('#msg').textContent=err.message}};
$('#list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const g=guests.find(x=>x.id===b.dataset.id);if(!g)return;try{switch(b.dataset.act){case 'copy':await navigator.clipboard.writeText(link(g));alert('Ссылка скопирована');return;case 'whatsapp':window.open('https://wa.me/?text='+encodeURIComponent(g.name+', сизди Айчолпондун кыз узатуу тоюна чакырабыз! '+link(g)),'_blank');return;case 'rename':{const n=prompt('Имя гостя',g.name);if(!n?.trim())return;await api('rename',{id:g.id,name:n.trim()});break}case 'delete':if(!confirm('Удалить приглашение?'))return;await api('delete',{id:g.id});break}await load()}catch(err){alert(err.message)}};
$('#refresh').onclick=async()=>{try{await load()}catch(e){$('#msg').textContent=e.message}};
$('#export').onclick=()=>{const rows=[['Имя','Ссылка','Ответ','Людей'],...guests.map(g=>[g.name,link(g),g.attending===null?'':g.attending?'Придёт':'Не придёт',g.people??''])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='aicholpon-guests.csv';a.click();URL.revokeObjectURL(a.href)};
check();
</script></html>
